server:
  port: 8181

spring:
  h2:
    console:
      enabled: true
  jpa:
    defer-datasource-initialization: true
    database: default
#  sql:
#    init:
#      mode: always

dataone:
  datasource:
    platform: h2
    driver-class-name: org.h2.Driver
    jdbc-url: jdbc:h2:./base-data-b;AUTO_SERVER=true;
    username: sa
    password: password
#    platform: org.hibernate.dialect.PostgreSQLDialect
#    driver-class-name: org.postgresql.Driver
#    jdbc-url: jdbc:postgresql://localhost:5432/toir
#    username: codela
#    password: 1

datatwo:
  datasource:
    platform: h2
    driver-class-name: org.h2.Driver
    jdbc-url: jdbc:h2:./base-data-b;AUTO_SERVER=true;
    username: sa
    password: password
#    maximum-pool-size: 1

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          [
            'configprops',
            'env',
            'health',
            'info',
            'jhimetrics',
            'jhiopenapigroups',
            'logfile',
            'loggers',
            'prometheus',
            'threaddump',
            'liquibase',
          ]
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  metrics:
    export:
      # Prometheus is the default metrics backend
      prometheus:
        enabled: true
        step: 60
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    tags:
      application: ${spring.application.name}
    web:
      server:
        request:
          autotime:
            enabled: true







